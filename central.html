<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: console de despacho - barra fixa (turno, busca, contagem) sobre uma fila de missões por horário ou por motorista */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#14213a; --muted:#5b6880; --line:#d5dbe5;
  --navy:#16325c; --navy-ink:#ffffff; --accent:#1f5fae;
  --ok:#1d7a46; --ok-bg:#e3f3ea; --warn:#a86400; --warn-bg:#fdf0d9; --bad:#b3261e; --bad-bg:#fbe5e3;
  --cmt:#7a4a00; --cmt-bg:#fff4dc; --plate:#ffffff; --plate-ink:#111; --plate-band:#1b4aa0;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --panel:#151f30; --ink:#e6ebf3; --muted:#9aa6bb; --line:#26344b;
  --navy:#0a1a33; --navy-ink:#e6ebf3; --accent:#6aa3ec;
  --ok:#5fd394; --ok-bg:#12301f; --warn:#f0b54d; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1714;
  --cmt:#ffcf6e; --cmt-bg:#2e2410; --plate:#f2f4f8; --plate-ink:#111; --plate-band:#2a5cc0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --panel:#151f30; --ink:#e6ebf3; --muted:#9aa6bb; --line:#26344b;
  --navy:#0a1a33; --navy-ink:#e6ebf3; --accent:#6aa3ec;
  --ok:#5fd394; --ok-bg:#12301f; --warn:#f0b54d; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1714;
  --cmt:#ffcf6e; --cmt-bg:#2e2410; --plate:#f2f4f8; --plate-ink:#111; --plate-band:#2a5cc0; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink);
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.clock{font-family:var(--f-mono);font-size:14px;opacity:.85;margin-left:auto}
.sync{font-size:12px;opacity:.8}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:8px;
  padding:6px 10px;font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.03em;cursor:pointer;text-transform:uppercase}
.tab small{font-family:var(--f-body);font-weight:500;text-transform:none;opacity:.75;margin-left:4px}
.tab[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy);border-color:var(--navy-ink)}
.tab.now::after{content:"agora";font-family:var(--f-body);font-size:10px;font-weight:600;text-transform:uppercase;margin-left:6px;
  background:var(--warn);color:#000;border-radius:4px;padding:1px 4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 260px;min-width:0;border:0;border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;background:var(--panel);color:var(--ink)}
.seg{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:inherit;padding:8px 12px;font:600 14px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy)}
.sum{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.chip{border-radius:999px;padding:3px 10px;font-weight:600;background:rgba(255,255,255,.12)}
.chip b{font-family:var(--f-mono)}
main{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:10px;max-width:1100px;margin:0 auto}
.notice{border-radius:8px;padding:10px 12px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.group-h{font-family:var(--f-disp);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  display:flex;gap:10px;align-items:center;margin-top:8px}
.group-h .tel{font-family:var(--f-mono);font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.m{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;
  display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px}
.m.s1{border-left-color:var(--accent)} .m.s2,.m.s3{border-left-color:var(--warn)} .m.s4{border-left-color:var(--ok);opacity:.72}
.m.late{border-left-color:var(--bad);background:linear-gradient(90deg,var(--bad-bg),var(--panel) 40%)}
.t{grid-row:span 3;display:flex;flex-direction:column;gap:2px}
.t .h{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.t .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 6px;align-self:flex-start}
.kind.c{background:var(--ok-bg);color:var(--ok)} .kind.r{background:var(--warn-bg);color:var(--warn)}
.line1{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.line1 b{color:var(--ink);font-weight:600}
.pax{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmt{background:var(--cmt-bg);color:var(--cmt);border-radius:6px;padding:2px 8px;font-weight:600}
.cmt small{font-weight:500;opacity:.85}
.who{font-size:15px}
.drv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.drv .tel{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--muted)}
button.copy{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font:500 12px var(--f-body);cursor:pointer}
.plate{display:inline-grid;grid-template-rows:6px auto;min-width:92px;border:1.5px solid #222;border-radius:4px;overflow:hidden;background:var(--plate);color:var(--plate-ink);text-align:center}
.plate::before{content:"";background:var(--plate-band)}
.plate span{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.08em;padding:1px 6px}
.car{color:var(--muted);font-size:13px}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:3px 8px;font-weight:600;font-size:13px}
.steps{grid-row:span 3;display:grid;grid-template-columns:repeat(2,minmax(84px,1fr));gap:6px;align-content:start}
.step{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:9px 6px;font:600 14px var(--f-body);cursor:pointer;min-height:44px}
.step small{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:2px}
.step.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.step.cur{box-shadow:0 0 0 2px var(--ok) inset}
.step:focus-visible,.tab:focus-visible,.seg button:focus-visible,button.copy:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.sub{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.live{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ok);color:#fff;border-radius:4px;padding:2px 6px}
span.step{cursor:default;display:block;text-align:center;border-style:dashed;color:var(--muted);min-height:0;padding:6px 4px;font-size:13px}
span.step.done{border-style:solid;color:var(--ok)}
#login{display:none;gap:6px;flex-wrap:wrap;align-items:center}
#login input{border:0;border-radius:8px;padding:8px 10px;font:inherit;font-size:16px;background:var(--panel);color:var(--ink);min-width:0;flex:1 1 160px}
#login button,#sair{border:1px solid rgba(255,255,255,.5);background:transparent;color:inherit;border-radius:8px;padding:8px 12px;font:600 14px var(--f-body);cursor:pointer}
#sair{padding:2px 8px;font-size:12px}
@media (max-width:760px){
  .m{grid-template-columns:64px minmax(0,1fr)}
  .t .h{font-size:28px}
  .steps{grid-column:1 / -1;grid-row:auto;grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){.m{transition:opacity .2s,border-color .2s}}
</style>
</head><body>

<header>
  <div class="top"><h1>Central de Missões · CNCG 2026</h1><span class="sub">Chefia de Transportes · CAP FERNANDES</span>
    <span class="live" id="modo">Acompanhamento ao vivo</span><span class="sync" id="sync">conectando…</span><span class="clock" id="clock"></span></div>
  <form id="login" autocomplete="on"><input id="em" type="email" placeholder="e-mail" autocomplete="username" required>

</header>

const FB = {"apiKey": "AIzaSyCaAvi_O6SLQDw9dRwLeF-igf8S6MzUJ-s", "authDomain": "cncg2026-central.firebaseapp.com", "projectId": "cncg2026-central", "storageBucket": "cncg2026-central.firebasestorage.app", "messagingSenderId": "637143167679", "appId": "1:637143167679:web:5e6ba52e7210b510924c0a"};   // firebaseConfig (público por natureza; a proteção está nas regras do Firestore)
const ETAPAS = ["OK do motorista","No ponto","Embarcado","Entregue"];
const CURTO = ["OK","No ponto","Embarcado","Entregue"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let status = {};           // id -> {etapa, h:[iso x4]}
let turno = null, modo = "hora", busca = "", db = null, canWrite = false;

const M = DADOS.missoes.map(m => ({...m, t: new Date(m.quando)}));
const TURNOS = [...new Map(M.map(m => [m.turno, m.turnoLabel])).entries()];

function turnoAgora(){
  const now = Date.now();
  const cur = M.find(m => m.turnoIni <= now && now < m.turnoFim);
  if (cur) return cur.turno;
  const prox = M.filter(m => m.turnoIni > now).sort((a,b) => a.turnoIni - b.turnoIni)[0];
  return prox ? prox.turno : (TURNOS.length ? TURNOS[TURNOS.length-1][0] : null);
}
function hhmm(d){ return d.toTimeString().slice(0,5) }
function etapa(id){ return (status[id] && status[id].etapa) || 0 }

function drawTabs(){
  const now = turnoAgora();
  $("#tabs").innerHTML = TURNOS.map(([k,l]) => {
    const n = M.filter(m => m.turno === k).length;
    return `<button class="tab${k===now?" now":""}" data-k="${k}" aria-pressed="${k===turno}">${esc(l)}<small>${n}</small></button>`;
  }).join("");
}

function card(m){
  const e = etapa(m.id), h = (status[m.id] && status[m.id].h) || [];
  const late = Date.now() > m.t.getTime() && e < 2 && e < 4;
  const cmts = m.pax.filter(p => p.cmt).map(p =>
    `<span class="cmt">${p.rep ? "Rep." : "Cmt"} ${esc(p.uf)} · CEL PM ${esc(p.nome)} <small>${esc(p.corp)}</small></span>`).join("");
  const steps = ETAPAS.map((s,i) => {
    const done = e > i, cur = e === i + 1;
    const ts = h[i] ? `<small>${hhmm(new Date(h[i]))}</small>` : "";
    if (!canWrite) return `<span class="step${done?" done":""}${cur?" cur":""}" title="${s}">${CURTO[i]}${ts}</span>`;
    return `<button class="step${done?" done":""}${cur?" cur":""}" data-id="${m.id}" data-i="${i+1}" aria-pressed="${done}" title="${s}">${CURTO[i]}${ts}</button>`;
  }).join("");
  return `<article class="m s${e}${late?" late":""}">
    <div class="t"><span class="k">${m.tipo==="C"?"apresentação":"no hotel"}</span><span class="h">${esc(m.hora)}</span>
      <span class="kind ${m.tipo==="C"?"c":"r"}">${m.tipo==="C"?"Chegada":"Retorno"}</span></div>
    <div class="line1"><b>${esc(m.voo)}</b> ${m.tipo==="C"?"pousa":"decola"} <b>${esc(m.horaVoo)}</b> · ${esc(m.local)} · ${m.comboio!=="-"?`<b>${esc(m.comboio)}</b> · `:""}sai <b>${esc(m.saida)}</b></div>
    <div class="steps">${steps}</div>
    <div class="who pax">${cmts}<span>${esc(m.desc)}</span>${m.alerta?`<span class="alert">⚠ ${esc(m.alerta)}</span>`:""}</div>
    <div class="drv"><span class="plate" aria-label="placa ${esc(m.placa)}"><span>${esc(m.placa || "—")}</span></span>
      <span>${esc(m.motorista)}</span><span class="car">${esc(m.modelo)}</span>
      ${m.tel?`<span class="tel">${esc(m.tel)}</span><button class="copy" data-copy="${esc(m.tel)}">copiar</button>`:""}</div>
  </article>`;
}

function filtradas(){
  const q = busca.trim().toLowerCase();
  return M.filter(m => q ? m.busca.includes(q) : m.turno === turno).sort((a,b) => a.t - b.t || a.cod.localeCompare(b.cod));
}

function draw(){
  const L = filtradas();
  const cont = [0,0,0,0,0]; L.forEach(m => cont[etapa(m.id)]++);
  const atras = L.filter(m => Date.now() > m.t.getTime() && etapa(m.id) < 2).length;
  $("#sum").innerHTML = `<span class="chip"><b>${L.length}</b> missões</span><span class="chip"><b>${cont[0]}</b> sem OK</span>`
    + `<span class="chip"><b>${cont[1]+cont[2]+cont[3]}</b> em andamento</span><span class="chip"><b>${cont[4]}</b> entregues</span>`
    + (atras ? `<span class="chip" style="background:var(--bad);color:#fff"><b>${atras}</b> atrasadas</span>` : "")
    + (busca ? `<span class="chip">busca em todos os turnos</span>` : "");
  const box = $("#list");
  if (!L.length){ box.innerHTML = `<p class="empty">${busca ? "Nada encontrado para essa busca." : "Sem missões neste turno."}</p>`; return }
  let html = "";
  if (!db) html += `<p class="notice">Sem conexão com o servidor das marcações. A escala continua visível; os status aparecem quando a conexão voltar.</p>`;
  if (modo === "hora"){
    let dia = "";
    for (const m of L){
      if (busca && m.dia !== dia){ dia = m.dia; html += `<h2 class="group-h">${esc(m.turnoLabel)}</h2>` }
      html += card(m);
    }
  } else {
    const por = new Map(); L.forEach(m => { const k = m.motorista + "|" + m.cod; if(!por.has(k)) por.set(k, []); por.get(k).push(m) });
    for (const [k, lst] of [...por.entries()].sort((a,b) => a[0].localeCompare(b[0]))){
      const m0 = lst[0];
      html += `<h2 class="group-h">${esc(m0.motorista)} · ${esc(m0.cod)} <span class="tel">${esc(m0.tel)}</span></h2>` + lst.map(card).join("");
    }
  }
  box.innerHTML = html;
}

async function marcar(id, i){
  if (!db || !canWrite) return;
  const antes = status[id];
  const cur = status[id] || {etapa:0, h:[null,null,null,null]};
  const h = (cur.h || [null,null,null,null]).slice();
  let nova;
  if (cur.etapa === i){ nova = i - 1; for (let k = i-1; k < 4; k++) h[k] = null }      // tocar a etapa atual desfaz
  else { nova = i; for (let k = 0; k < i; k++) if (!h[k]) h[k] = new Date().toISOString(); for (let k = i; k < 4; k++) h[k] = null }
  status[id] = {etapa: nova, h}; draw();
  try { await db.collection("status").doc(id).set({etapa: nova, h, em: new Date().toISOString()}) }
  catch(e){
    if (antes) status[id] = antes; else delete status[id]; draw();
    $("#sync").textContent = e && e.code === "permission-denied" ? "sem permissão para marcar (entre de novo)" : "falha ao salvar - tente de novo";
  }
}

document.addEventListener("click", ev => {
  const s = ev.target.closest(".step"); if (s){ marcar(s.dataset.id, +s.dataset.i); return }
  const t = ev.target.closest(".tab"); if (t){ turno = t.dataset.k; busca = ""; $("#q").value = ""; drawTabs(); draw(); return }
  const c = ev.target.closest("button.copy");
  if (c){ const v = c.dataset.copy; navigator.clipboard?.writeText(v).then(() => { c.textContent = "copiado" }, () => { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r) }); }
});
$("#q").addEventListener("input", e => { busca = e.target.value; draw() });
for (const [id, v] of [["#v-hora","hora"],["#v-mot","mot"]]) $(id).addEventListener("click", () => {
  modo = v; $("#v-hora").setAttribute("aria-pressed", v==="hora"); $("#v-mot").setAttribute("aria-pressed", v==="mot"); draw() });

function tick(){ $("#clock").textContent = new Date().toLocaleString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) }
turno = turnoAgora(); drawTabs(); draw(); tick();
setInterval(() => { tick(); draw() }, 60000);

function modoEdicao(on, email){
  canWrite = on;
  $("#modo").textContent = on ? "Edição · " + email : "Acompanhamento ao vivo";
  $("#modo").style.background = on ? "var(--warn)" : "";
  $("#login").style.display = (!on && location.hash === "#editor") ? "flex" : "none";
  const s = $("#sair"); if (s) s.remove();
  if (on){ const b = document.createElement("button"); b.id = "sair"; b.textContent = "sair";
    b.onclick = () => firebase.auth().signOut(); $("#modo").after(b) }
  draw();
}

(() => {
  if (!FB || !window.firebase){ $("#sync").textContent = "sem sincronização"; draw(); return }
  firebase.initializeApp(FB);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => modoEdicao(!!u, u ? u.email : ""));
  window.addEventListener("hashchange", () => modoEdicao(canWrite, firebase.auth().currentUser?.email || ""));
  $("#login").addEventListener("submit", async ev => {
    ev.preventDefault(); $("#sync").textContent = "entrando…";
    try { await firebase.auth().signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); $("#pw").value = "" }
    catch(e){ $("#sync").textContent = "e-mail ou senha não conferem" }
  });
  let carregou = false;
  const timer = setTimeout(() => { if (!carregou) $("#sync").textContent = "sem resposta do servidor - marcações podem estar desatualizadas" }, 10000);
  db.collection("status").onSnapshot({includeMetadataChanges: true}, snap => {
    status = {}; snap.docs.forEach(d => { const x = d.data(); status[d.id] = {etapa: x.etapa || 0, h: x.h || []} });
    if (!snap.metadata.fromCache){ carregou = true; clearTimeout(timer); $("#sync").textContent = "conectado" }
    else if (carregou) $("#sync").textContent = "sem conexão - exibindo último estado";
    draw();
  }, err => { clearTimeout(timer); $("#sync").textContent = "sincronização interrompida (" + err.code + ")" });
})();
</script>
</body></html>
